run-shell ~/.tmux/plugins/tmux-fingers/tmux-fingers.tmux

set -g default-terminal "wezterm"

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

set -sg escape-time 10

set -g history-limit 50000          # default 2000 is tiny
set -g renumber-windows on          # no gaps in window numbers after closing
setw -g aggressive-resize on        # better when attached from multiple clients
set -g display-time 2000            # messages linger 2s instead of 750ms

# pane border colours (spot the active pane)
set -g pane-active-border-style 'fg=colour4'
set -g pane-border-style 'fg=colour238'

# pane titles in the top border (format lives in the theme), only shown
# when the window is split
set -g pane-border-status off
set-hook -g window-layout-changed 'if -F "#{==:#{window_panes},1}" "setw -u pane-border-status" "setw pane-border-status top"'
# apply to windows that are already split when the config is (re)loaded
run-shell -b 'tmux list-windows -a -F "#{window_id} #{window_panes}" | while read w n; do [ "$n" -gt 1 ] && tmux setw -t "$w" pane-border-status top; done; true'
# set the current pane's title
bind P command-prompt -p "pane title:" { select-pane -T "%%" }

set-window-option -g mode-keys vi
set -g focus-events on

unbind C-b
set -g prefix C-a

bind-key x kill-pane

bind c new-window -c "#{pane_current_path}"
# split panes using | and -
bind / split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind -r h previous-window
bind -r l next-window
bind \; last-window
bind -r j switch-client -n
bind -r k switch-client -p

# move current window to another session (pick target interactively)
# tree_fmt (colours) is defined in the alabaster theme
bind m choose-tree -Zs -F "#{E:tree_fmt}" "move-window -t '%%'"

# rename window with an empty prompt (default pre-fills current name)
bind , command-prompt { rename-window "%%" }

# create a new named session from a prompt
bind S command-prompt -p "new session:" { new-session -s "%%" }

unbind-key C-a
bind-key C-a send-prefix

bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

set -g mouse on

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# swap window to left or right
bind-key -r < swap-window -t -1\; select-window -t -1
bind-key -r > swap-window -t +1\; select-window -t +1

# swap pane in direction
bind-key -r Up    swap-pane -s '{up-of}'
bind-key -r Down  swap-pane -s '{down-of}'
bind-key -r Left  swap-pane -s '{left-of}'
bind-key -r Right swap-pane -s '{right-of}'

source ~/dotfiles/tmux/themes/alabaster-theme.conf
# selection bar in choose-tree + copy-mode selection: alabaster block
set -g mode-style 'fg=#cecece,bg=#333333'

# auto-rename windows to the current folder name instead of the running
# command. Windows renamed manually (bind ',' below) opt out automatically.
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

set-option -g status-position bottom

set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# jump back to the previously active session
bind-key -n 'C-\' switch-client -l

# quick lazygit popup - dismiss with q, lands you back exactly where you were
bind-key g display-popup -d '#{pane_current_path}' -w95% -h95% -E "lazygit"

# workmux agent dashboard popup - dismiss with q
bind-key b display-popup -d '#{pane_current_path}' -w95% -h95% -E '/Users/Pro/.config/workmux/launch/dashboard #{client_tty}'

# tag each Ghostty window title with its tmux client tty so the dashboard can focus the right screen
set -g set-titles on
set -g set-titles-string '#S:#W [#{client_tty}]'

# daily note - one window per day inside a persistent `notes` session
bind-key N run-shell -b "${HOME}/dotfiles/tmux/notes.sh"

# fast nav already free via tmux defaults (nothing to bind):
#   prefix f   fuzzy find-window (name/content)
#   prefix L   jump to last active session
#   prefix o   cycle to "other" pane
#   prefix ;   toggle last active pane
#   prefix q   flash pane numbers, press digit to jump

# Remap zoom to Ctrl+b m
unbind z
bind z resize-pane -Z

# Resize panes (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


set -g detach-on-destroy off  # don't exit from tmux when closing a session

unbind t
bind-key "t" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# VI mode
bind-key v copy-mode
# Begin selection with 'v' instead of 'Space'
bind-key -T copy-mode-vi 'v' send -X begin-selection

# Copy selection with 'y' instead of 'Enter'
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind-key -T copy-mode-vi Y send-keys -X select-line \; send-keys -X copy-selection-and-cancel

# Rectangular selection (Visual Block) with 'Ctrl+v'
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
