# Alabaster tmux theme
# Palette matches dchinmay2/alabaster.nvim's dark lualine theme + the
# alabaster-dark ghostty theme, so tmux stays visually consistent with
# nvim/terminal:
#   base   #162022  (statusline bg)
#   fg     #cecece  (text)
#   muted  #9F9F9F  (inactive text)
#   block  #333333  (nvim "normal mode" indicator bg)
#   accent #cd974b  (cursor / orange accent)
#   visual #cc8bc9  (purple accent)

set -g status-justify "left"
set -g status "on"
set -g status-left-style "none"
set -g status-right-style "none"
set -g status-style "none,bg=#162022"
set -g status-right-length "100"
set -g status-left-length "100"
set -g status-interval 5

set -g message-style "fg=#162022,bg=#cecece"
set -g message-command-style "fg=#162022,bg=#cecece"

set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#cd974b,bold"

setw -g window-status-separator ""
setw -g window-status-style "none,fg=#9F9F9F,bg=#162022"
setw -g window-status-activity-style "none,fg=#cc8bc9,bg=#162022,bold"

# Left: [session] + zoom indicator, solid accent block
set -g status-left "#[fg=#162022,bg=#cd974b,bold] #S #[fg=#cd974b,bg=#162022,nobold]#{?window_zoomed_flag, #[fg=#cd974b]Z,}  "

# Right: git branch + time
set -g status-right "  #[fg=#9F9F9F]#(cd #{pane_current_path}; git branch --show-current 2>/dev/null)  #[fg=#333333]%R "

# Claude Code state dot (set per-window by ~/dotfiles/tmux/cc-tmux-state.sh via
# Claude Code hooks). accent=working, red=waiting, green=done-and-not-yet-seen,
# white=done-and-seen, using the alabaster-dark palette (accent #cd974b, red
# #e35d58, string-green #95cb82, fg #cecece). Renders nothing when @cc_state is
# unset, so non-Claude windows look untouched.
# %hidden so the fragment can be reused in both window formats below.
%hidden cc_dot="#{?#{==:#{@cc_state},working}, #[fg=#cd974b]●,#{?#{==:#{@cc_state},waiting}, #[fg=#e35d58]●,#{?#{==:#{@cc_state},idle}, #[fg=#95cb82]●,#{?#{==:#{@cc_state},seen}, #[fg=#cecece]●,}}}}"

# Focusing a window acknowledges a finished Claude turn: green (idle) becomes
# white (seen) and stays white until the next hook event repaints it.
# pane-focus-in covers visiting a green window; pane-focus-out covers the turn
# that finished while you were already inside it. Guarded so only idle flips --
# non-Claude windows and other states are untouched.
# NB: -gp (global pane scope) is required -- pane hooks silently no-op when
# set with plain `set-hook -g`. Also note the hooks only fire while the
# client terminal itself is focused (focus-events), so scripts can't trigger
# them -- verify by hand: focus a green window, the dot must turn white.
# run-shell (not `if -F`) because focus hooks can fire for a pane that is
# already being destroyed (closing a window / killing a session); `if -F`
# then fails target resolution and flashes "<file>:<line>: no current pane"
# in the status line. run-shell tolerates a missing target -- the formats
# expand empty, the shell condition is false, nothing happens.
set-hook -gp pane-focus-in  { run-shell -b "if [ '#{@cc_state}' = idle ]; then tmux set-option -w -t '#{hook_pane}' @cc_state seen 2>/dev/null; fi" }
set-hook -gp pane-focus-out { run-shell -b "if [ '#{@cc_state}' = idle ]; then tmux set-option -w -t '#{hook_pane}' @cc_state seen 2>/dev/null; fi" }

# choose-tree (prefix-s / prefix-m) item colours: muted metadata, green
# "attached" marker. The "(0) + name:" prefix is drawn by tmux itself and
# can't be styled; the format only controls the text after the colon.
# Lines can be a session, window or pane depending on expansion, hence the
# nested conditionals.
%hidden tree_fmt="#{?pane_format,#[fg=#9F9F9F]#{pane_current_command} #{pane_title},#{?window_format,#[fg=#cecece]#{window_name}#[fg=#9F9F9F] - #{window_panes} panes,#[fg=#9F9F9F]#{session_windows} windows#{?session_attached,#[fg=#95cb82] (attached),}}}"

# Inactive windows
setw -g window-status-format "#[fg=#9F9F9F] #I #W#{E:cc_dot}#[fg=#9F9F9F] "

# Active window: solid block (mirrors alabaster's normal-mode lualine indicator)
# for strong contrast against the status bar background.
setw -g window-status-current-format "#[fg=#cecece,bg=#333333,bold] #I #W#{E:cc_dot}#[fg=#cecece,bg=#333333,bold] #[fg=#333333,bg=#162022,nobold]"
